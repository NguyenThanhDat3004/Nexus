spring.application.name=identify_access
server.port=${IDENTITY_SERVICE_PORT:8081}

# ==============================================================================
# DataSource (PostgreSQL - Đọc từ .env hoặc biến môi trường)
# ==============================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_IDENTITY_NAME:nexus_identity}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# JPA / Hibernate Configuration
# (Dùng validate để Hibernate kiểm tra khớp với Flyway, không tự sinh đè schema)
# ==============================================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# Flyway Migration Configuration
# ==============================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Bật log Flyway để thấy rõ quá trình tạo bảng
logging.level.org.flywaydb=INFO

# ==============================================================================
# SSO / OAuth2 Google Configuration
# ==============================================================================
sso.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id_here}
sso.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret_here}
sso.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:3000/oauth/callback}

